name: Feature request
description: A change to the chart, image, or docs
title: "[feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard to do with the chart today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The values, behavior, or docs you want. Stay within what upstream OpenKB actually supports.
    validations:
      required: true
