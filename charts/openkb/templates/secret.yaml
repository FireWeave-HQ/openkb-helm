{{- if include "openkb.createSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openkb.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openkb.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if not .Values.auth.allowUnauthenticated }}
  OPENKB_API_TOKEN: {{ include "openkb.apiToken" . | b64enc | quote }}
  {{- end }}
  {{- if .Values.llm.apiKey }}
  LLM_API_KEY: {{ .Values.llm.apiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.llm.pageindexApiKey }}
  PAGEINDEX_API_KEY: {{ .Values.llm.pageindexApiKey | b64enc | quote }}
  {{- end }}
{{- end }}
