apiVersion: v2
name: openkb
description: Community Helm chart for OpenKB (Open LLM Knowledge Base by VectifyAI). Deploys the OpenKB REST API and Knowledge Workbench on Kubernetes.
type: application
version: 0.1.0
# PyPI version of the upstream release this chart deploys. Git tag is v0.5.0-rc1.
# The latest stable tag v0.4.5 is CLI-only and does not include the server.
appVersion: "0.5.0rc1"
# As of November 2026, upstream Kubernetes supports 1.35, 1.36, and 1.37
# (1.34 reached end of life on 2026-10-27). This chart only uses GA APIs
# (apps/v1, networking.k8s.io/v1, policy/v1, core v1) that have been stable
# since well before 1.28. The floor stays at 1.28 so a Helm binary whose
# embedded client version is older than 1.35 can still render the chart.
# Run it on a supported cluster when you can.
kubeVersion: ">=1.28.0-0"
home: https://github.com/FireWeave-HQ/openkb-helm
icon: https://raw.githubusercontent.com/FireWeave-HQ/openkb-helm/main/.github/assets/icon.png
sources:
  - https://github.com/FireWeave-HQ/openkb-helm
  - https://github.com/VectifyAI/OpenKB
keywords:
  - openkb
  - vectifyai
  - knowledge-base
  - knowledge-workbench
  - llm
  - rag
  - retrieval
  - pageindex
  - litellm
  - ai
  - agents
  - fastapi
  - self-hosted
maintainers:
  - name: FireWeave-HQ
    url: https://github.com/FireWeave-HQ
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "false"
  artifacthub.io/category: ai-machine-learning
  # Community packaging. Not published or endorsed by Vectify AI.
  artifacthub.io/links: |
    - name: Chart source
      url: https://github.com/FireWeave-HQ/openkb-helm
    - name: Chart repository
      url: https://fireweave-hq.github.io/openkb-helm
    - name: Upstream OpenKB
      url: https://github.com/VectifyAI/OpenKB
    - name: Upstream license
      url: https://github.com/VectifyAI/OpenKB/blob/v0.5.0-rc1/LICENSE
    - name: Report a chart issue
      url: https://github.com/FireWeave-HQ/openkb-helm/issues
  artifacthub.io/changes: |
    - kind: added
      description: First community release. Deploys OpenKB 0.5.0rc1 (REST API and Knowledge Workbench).
    - kind: security
      description: Bearer-token authentication on by default; non-root, read-only root filesystem.
