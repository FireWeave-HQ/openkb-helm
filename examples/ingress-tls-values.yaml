# Ingress with TLS. The annotations below are nginx examples; set the ones your
# controller understands. SSE (query, chat, add) needs a long proxy read timeout.
auth:
  existingSecret: openkb-credentials

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: kb.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: openkb-tls
      hosts:
        - kb.example.com
